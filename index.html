<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>社員制服 撮影アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* iOSのSafariでビデオが正しく表示されるための設定 */
    video { object-fit: cover; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

  <div id="app-container" class="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col relative overflow-hidden">
    <header class="bg-blue-700 text-white p-4 text-center shadow-md z-10">
      <h1 class="text-lg font-bold flex items-center justify-center gap-2">
        <i data-lucide="camera" class="w-5 h-5"></i>
        制服写真 撮影システム
      </h1>
    </header>

    <main class="flex-1 flex flex-col p-4 gap-4 overflow-y-auto pb-6">
      <!-- 社員情報入力 -->
      <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 shadow-sm">
        <label for="employee-info" class="block text-sm font-bold text-gray-700 mb-2">社員情報</label>
        <input 
          type="text" 
          id="employee-info" 
          placeholder="例: 12345/山田太郎" 
          class="w-full border-2 border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-lg transition-colors"
          autocomplete="off"
        >
        <div id="error-container" class="mt-2 text-red-600 text-sm font-medium flex items-start gap-1">
          <i data-lucide="alert-circle" class="w-4 h-4 mt-0.5 shrink-0"></i>
          <span>「社員番号（半角5桁）/氏名」の形式で入力してください。</span>
        </div>
      </div>

      <!-- カメラ・プレビューエリア（顔枠復活！） -->
      <div class="relative w-full aspect-[3/4] bg-black rounded-2xl overflow-hidden shadow-inner border border-gray-200">
        <!-- カメラビュー -->
        <div id="camera-view" class="absolute inset-0 w-full h-full">
          <video id="video-element" class="w-full h-full object-cover" autoplay playsinline muted></video>
          <!-- 顔枠オーバーレイ -->
          <div class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center">
            <div class="w-56 h-56 border-4 border-yellow-400 rounded-full opacity-90 shadow-[0_0_0_2000px_rgba(0,0,0,0.5)] transform -translate-y-8"></div>
          </div>
          <div class="absolute top-6 w-full px-4 pointer-events-none z-10">
            <div class="bg-black/75 text-white text-sm text-center py-2.5 px-4 rounded-lg mx-auto shadow-lg border border-yellow-400/50 backdrop-blur-sm">
              <span class="text-yellow-400 font-bold text-base">【お願い】</span><br>
              黄色い丸に顔がぴったり合うように<br>近づいて撮影してください！
            </div>
          </div>
          <button id="toggle-camera-btn" class="absolute bottom-4 right-4 bg-black/60 text-white p-3 rounded-full hover:bg-black/80 transition-colors backdrop-blur-sm shadow-lg border border-white/20">
            <i data-lucide="switch-camera" class="w-6 h-6"></i>
          </button>
        </div>

        <!-- プレビュー -->
        <div id="preview-view" class="absolute inset-0 w-full h-full hidden bg-gray-900 flex-col items-center justify-center">
          <img id="preview-image" class="w-full h-full object-cover" alt="撮影プレビュー" />
        </div>
      </div>

      <!-- アクションボタン -->
      <div class="mt-auto pt-2">
        <div id="camera-actions" class="flex justify-center">
          <button id="capture-btn" disabled class="group relative flex items-center justify-center w-20 h-20 bg-blue-600 rounded-full border-4 border-white shadow-lg hover:bg-blue-700 hover:scale-105 transition-all disabled:bg-gray-300 disabled:border-gray-200 disabled:shadow-none disabled:transform-none">
            <i data-lucide="camera" class="w-8 h-8 text-white group-disabled:text-gray-400"></i>
          </button>
        </div>

        <div id="preview-actions" class="hidden grid-cols-2 gap-4">
          <button id="retake-btn" class="py-3.5 px-4 border-2 border-gray-300 rounded-xl bg-white text-gray-700 font-bold hover:bg-gray-50 flex items-center justify-center gap-2">
            <i data-lucide="rotate-ccw" class="w-5 h-5"></i> 撮り直し
          </button>
          <button id="save-btn" class="py-3.5 px-4 bg-green-600 rounded-xl text-white font-bold hover:bg-green-700 flex items-center justify-center gap-2 shadow-sm shadow-green-600/30">
            <i data-lucide="upload-cloud" class="w-5 h-5"></i> 決定・保存
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();

    const video = document.getElementById('video-element');
    const inputField = document.getElementById('employee-info');
    const errorContainer = document.getElementById('error-container');
    const captureBtn = document.getElementById('capture-btn');
    const toggleCameraBtn = document.getElementById('toggle-camera-btn');
    const retakeBtn = document.getElementById('retake-btn');
    const saveBtn = document.getElementById('save-btn');
    const cameraView = document.getElementById('camera-view');
    const previewView = document.getElementById('preview-view');
    const previewImage = document.getElementById('preview-image');
    const cameraActions = document.getElementById('camera-actions');
    const previewActions = document.getElementById('preview-actions');

    let stream = null;
    let currentFacingMode = 'user';
    let capturedDataUrl = null;

    async function startCamera(facingMode) {
      if (stream) stream.getTracks().forEach(track => track.stop());
      try {
        const constraints = {
          video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 1920 } },
          audio: false
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
      } catch (err) {
        alert(`カメラの起動に失敗しました。URLバーの左側のアイコン等から、カメラへのアクセスを許可してください。`);
      }
    }

    function validateInput() {
      let val = inputField.value.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/／/g, '/');
      if (val !== inputField.value) inputField.value = val;
      const isValid = /^\d{5}\/.+$/.test(val);
      errorContainer.classList.toggle('hidden', isValid);
      captureBtn.disabled = !isValid;
    }

    captureBtn.onclick = () => {
      // 画像サイズを圧縮
      const MAX_WIDTH = 800;
      let width = video.videoWidth;
      let height = video.videoHeight;
      
      if (width > MAX_WIDTH) {
        height = Math.round(height * (MAX_WIDTH / width));
        width = MAX_WIDTH;
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      if (currentFacingMode === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 画質を0.6に下げてデータ量を削減
      capturedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
      previewImage.src = capturedDataUrl;

      cameraView.classList.add('hidden');
      cameraActions.classList.add('hidden');
      previewView.classList.remove('hidden');
      previewActions.classList.remove('hidden');
      previewActions.classList.add('grid');
    };

    retakeBtn.onclick = () => {
      capturedDataUrl = null;
      previewView.classList.add('hidden');
      previewActions.classList.add('hidden');
      previewActions.classList.remove('grid');
      cameraView.classList.remove('hidden');
      cameraActions.classList.remove('hidden');
      
      // 入力をリセット
      inputField.value = '';
      validateInput();
    };

    saveBtn.onclick = () => {
      if (!capturedDataUrl) return;

      // ★ここに新しく発行したGASのURL（/execで終わるもの）を貼り付けてください
      const gasUrl = "★ここにGASのウェブアプリURLを貼り付ける★";

      if (gasUrl.includes("★")) {
        alert("コード内の gasUrl に、新しく発行したURLを貼り付けてください。");
        return;
      }

      saveBtn.disabled = true;
      const originalHtml = saveBtn.innerHTML;
      saveBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> 認証＆通信中...';
      lucide.createIcons();

      // ★ 最終奥義：GASのページを別タブで開いて、写真データを直接パスする！
      const gasWindow = window.open(gasUrl, '_blank');
      
      if (!gasWindow) {
        alert("ポップアップがブロックされました。\nブラウザの設定でこのサイトのポップアップを「許可」してください。");
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalHtml;
        lucide.createIcons();
        return;
      }

      // GASの別タブからの連絡を待つ処理
      const messageHandler = (e) => {
        // GAS画面から「準備できたよ」と来たら、写真を投げる
        if (e.data === 'READY') {
          gasWindow.postMessage({
            type: 'SAVE_IMAGE',
            fileName: inputField.value.replace('/', '_') + '.jpg',
            image: capturedDataUrl
          }, '*');
        } 
        // GAS画面から「成功したよ」と来たら完了処理
        else if (e.data === 'SUCCESS') {
          window.removeEventListener('message', messageHandler);
          alert("保存完了しました！\n管理者の共有ドライブに保存されました。\n削除を依頼する場合は岩田か成田までお知らせください。");
          inputField.value = '';
          validateInput();
          retakeBtn.click();
          
          saveBtn.disabled = false;
          saveBtn.innerHTML = originalHtml;
          lucide.createIcons();
        } 
        // エラーが来た場合
        else if (e.data === 'ERROR') {
          window.removeEventListener('message', messageHandler);
          alert('保存に失敗しました。');
          saveBtn.disabled = false;
          saveBtn.innerHTML = originalHtml;
          lucide.createIcons();
        }
      };

      // 連絡待ちをスタート
      window.addEventListener('message', messageHandler);
    };

    inputField.addEventListener('input', validateInput);
    toggleCameraBtn.onclick = () => {
      currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
      startCamera(currentFacingMode);
    };

    window.onload = () => {
      validateInput();
      startCamera(currentFacingMode);
    };
  </script>
</body>
</html>
